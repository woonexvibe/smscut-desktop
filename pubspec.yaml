name: lite_cut
description: A lite video editor (trim, split, merge, crop, speed, music, text) built with Flutter + FFmpeg.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  file_picker: 10.3.7
  path_provider: ^2.1.4
  path: ^1.9.0
  gal: ^2.3.0
  # The original ffmpeg_kit_flutter is discontinued; this is a maintained fork.
  ffmpeg_kit_flutter_new: ^4.5.3
  video_player_win: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
